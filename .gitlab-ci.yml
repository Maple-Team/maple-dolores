stages:
  - trigger

trigger-react18-webpack-job:
  stage: trigger
  trigger:
    include:
      - local: 'packages/react18-webpack/.gitlab-ci.yml'
  rules:
    - changes:
        - packages/react18-webpack/**/*
    # 允许触发的子流水线中无任务导致的失败
    # 1. 合并前会有无流水线任务
  allow_failure: true

trigger-vue3-job:
  stage: trigger
  trigger:
    include:
      - local: 'packages/vue3/.gitlab-ci.yml'
  rules:
    - changes:
        - packages/vue3/**/*
  # 允许触发的子流水线中无任务导致的失败
  allow_failure: true

trigger-main-job:
  stage: trigger
  trigger:
    include:
      - local: 'packages/main/.gitlab-ci.yml'
  rules:
    - changes:
        - packages/main/**/*
  # 允许触发的子流水线中无任务导致的失败
  allow_failure: true
