include:
  # 引入公共配置（定义通用变量、作业模板等）
  - local: '.gitlab-ci-common.yml'
  # 动态引入子目录的 CI 配置（关键：仅在目录变更时引入）
  - local: 'packages/react18-webpack/.gitlab-ci.yml'
    rules:
      - changes:
          - packages/react18-webpack/**/*
  - local: 'packages/vue3/.gitlab-ci.yml'
    rules:
      - changes:
          - packages/vue3/**/*
  - local: 'packages/main/.gitlab-ci.yml'
    rules:
      - changes:
          - packages/main/**/*

variables:
  PNPM_HOME: '$CI_PROJECT_DIR/.pnpm'
  PNPM_STORE_DIR: '$CI_PROJECT_DIR/.pnpm-store'
  NODE_IMAGE: 'mapleimage123/node:20-alpine3.19'
  COREPACK_NPM_REGISTRY: 'https://registry.npmmirror.com'
  TZ: 'Asia/Shanghai'

workflow:
  name: 'workflow name'

stages:
  - install
  - build
  - image
  - deploy
  - notify
# 公共的步骤，可以在其他.gitlab-ci.yml文件中引用
# 如果pnpm-lock.yaml没有变化就不会执行

before_script:
  - echo "before_script"
  - echo "CI_PIPELINE_SOURCE $CI_PIPELINE_SOURCE"
  - echo "CI_MERGE_REQUEST_SOURCE_BRANCH_NAME $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
  - echo "CI_MERGE_REQUEST_TARGET_BRANCH_NAME $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
  - echo "CI_MERGE_REQUEST_TITLE $CI_MERGE_REQUEST_TITLE"
  - echo "CI_COMMIT_REF_NAME $CI_COMMIT_REF_NAME"
  - echo "CI_COMMIT_REF_PROTECTED $CI_COMMIT_REF_PROTECTED"
  - echo "CI_COMMIT_REF_SLUG $CI_COMMIT_REF_SLUG"
  - echo "CI_MERGE_REQUEST_ID $CI_MERGE_REQUEST_ID"
  - export

install-job:
  extends: .install-job
