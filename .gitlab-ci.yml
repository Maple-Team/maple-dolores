stages:
  - trigger

trigger-react18-webpack-job:
  stage: trigger
  trigger:
    include:
      - local: 'packages/react18-webpack/.gitlab-ci.yml'
  rules:
    - changes:
        - packages/react18-webpack/**/*

trigger-vue3-job:
  stage: trigger
  trigger:
    include:
      - local: 'packages/vue3/.gitlab-ci.yml'
  rules:
    - changes:
        - packages/vue3/**/*

trigger-main-job:
  stage: trigger
  trigger:
    include:
      - local: 'packages/main/.gitlab-ci.yml'
  rules:
    - changes:
        - packages/main/**/*
