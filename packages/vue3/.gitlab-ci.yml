include:
  - local: '.gitlab-ci-common.yml'

build-job-vue3:
  extends:
    - .build-job
    # - .deploy-rule
  variables:
    SUB_PACKAGE: 'vue3'

build-image-job-vue3:
  extends:
    - .build-image-job
  dependencies:
    - build-job-vue3
  needs:
    - job: build-job-vue3
  variables:
    SUB_PACKAGE: 'vue3'

deploy-job-vue3:
  extends:
    - .deploy-job
  needs:
    - job: build-image-job-vue3
  variables:
    SUB_PACKAGE: 'vue3'
    SUB_PACKAGE_PORT: '6042'

# eslint
eslint-job-vue3:
  extends:
    - .eslint
  variables:
    SUB_PACKAGE: 'vue3'
