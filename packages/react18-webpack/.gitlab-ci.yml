include:
  - local: '.gitlab-ci-common.yml'

build-job-react18-webpack:
  extends:
    - .build-job
    - .merge-request
  variables:
    SUB_PACKAGE: 'react18-webpack'

build-image-job-react18-webpack:
  extends:
    - .build-image-job
    - .merge-request
  variables:
    SUB_PACKAGE: 'react18-webpack'
  dependencies:
    - build-job-react18-webpack
  needs:
    - job: build-job-react18-webpack

deploy-job-react18-webpack:
  extends:
    - .deploy-job
    - .merge-request

  variables:
    SUB_PACKAGE: 'react18-webpack'
    SUB_PACKAGE_PORT: '6043'
  needs:
    - job: build-image-job-react18-webpack

# 部署成功的通知
notify-success-react18-webpack:
  extends:
    - .notify-success
    - .merge-request
  variables:
    SUB_PACKAGE: 'react18-webpack'
  needs:
    - job: deploy-job-react18-webpack

# 部署失败的通知
notify-failure-react18-webpack:
  extends:
    - .notify-failure
    - .merge-request
  variables:
    SUB_PACKAGE: 'react18-webpack'
  needs:
    - job: deploy-job-react18-webpack

# eslint
eslint-job-react18-webpack:
  extends: .eslint
  variables:
    SUB_PACKAGE: 'react18-webpack'
