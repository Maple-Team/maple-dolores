include:
  - local: '.gitlab-ci-common.yml'

build-job-main:
  extends:
    - .build-job
    # - .deploy-rule
  variables:
    SUB_PACKAGE: 'main'

build-image-job-main:
  extends:
    - .build-image-job
  variables:
    SUB_PACKAGE: 'main'
  dependencies:
    - build-job-main
  needs:
    - job: build-job-main

deploy-job-main:
  extends:
    - .deploy-job
  variables:
    SUB_PACKAGE: 'main'
    SUB_PACKAGE_PORT: '6040'
  needs:
    - job: build-image-job-main

# eslint
eslint-job-main:
  extends:
    - .eslint
  variables:
    SUB_PACKAGE: 'main'
